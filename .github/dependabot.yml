# ModelFabric has very few dependencies on purpose, so these updates should be rare
# and worth reading when they arrive.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Pinned actions drift into deprecation quietly; this is how you find out
  # before a release fails.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
