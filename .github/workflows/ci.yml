name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets a release be cut from a commit whose CI has already passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Node is required to validate and stage the embedded dashboard.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: make check
        run: make check

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n scripts/deploy.sh
      - name: Installer self-check
        run: make check-install

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the docs site
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
