# Release tags use make dist, the same build target as mesh deployment.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without pushing a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (an existing tag; no release is published)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write # record it
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is `git describe`, so the tag has to be there.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build every platform
        run: make dist

      - name: Show what shipped
        run: cat dist/checksums.txt

      # Verify build provenance with:
      #
      #   gh attestation verify mfsh-linux-amd64 -R gregbugaj/modelfabric
      - name: Attest the binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/mfsh-linux-amd64
            dist/mfsh-linux-arm64
            dist/mfsh-darwin-arm64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Manual dispatch builds and attests without publishing.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/mfsh-linux-amd64 \
            dist/mfsh-linux-arm64 \
            dist/mfsh-darwin-arm64 \
            dist/checksums.txt
