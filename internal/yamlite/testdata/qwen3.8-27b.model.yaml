# model.yaml is an open standard for defining cross-platform, composable AI models
# Learn more at https://modelyaml.org
model: qwen/qwen3.8-27b
base:
  - key: lmstudio-community/qwen3.8-27b-gguf
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: Qwen3.8-27B-GGUF
  - key: lmstudio-community/qwen3.8-27b-mlx-4bit
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: Qwen3.8-27B-MLX-4bit
  - key: lmstudio-community/qwen3.8-27b-mlx-5bit
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: Qwen3.8-27B-MLX-5bit
  - key: lmstudio-community/qwen3.8-27b-mlx-6bit
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: Qwen3.8-27B-MLX-6bit
  - key: lmstudio-community/qwen3.8-27b-mlx-8bit
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: Qwen3.8-27B-MLX-8bit
metadataOverrides:
  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
    - safetensors
  paramsStrings:
    - 27B
  minMemoryUsageBytes: 16100000000
  contextLengths:
    - 262144
  vision: true
  reasoning: true
  trainedForToolUse: true
config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topKSampling
        value: 20
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.minPSampling
        value:
          checked: false
          value: 0
      - key: llm.prediction.repeatPenalty
        value:
          checked: false
          value: 1.0
      - key: llm.prediction.llama.presencePenalty
        value:
          checked: false
          value: 0.0
customFields:
  - key: reasoningEffort
    displayName: Reasoning Effort
    description: Controls how much reasoning the model should perform.
    type: select
    defaultValue: xhigh
    options:
      - value: xhigh
        label: Extra High
      - value: medium
        label: Medium
      - value: low
        label: Low
    effects:
      - type: setJinjaVariable
        variable: reasoning_effort
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
  - key: preserveThinking
    displayName: Preserve Thinking
    description: Preserve reasoning content in all prior assistant turns instead of only the most recent one
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: preserve_thinking
